<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ec4899;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f0f0f0;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0.64" stdDeviation="0.96" flood-color="#ec4899" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- Background with rounded corners -->
  <rect width="32" height="32" rx="6.4" ry="6.4" fill="#0a0a0f"/>
  
  <!-- Gradient border -->
  <rect x="2" y="2" width="28" height="28" rx="6.08" ry="6.08" fill="none" stroke="url(#bgGrad)" stroke-width="2"/>
  
  <!-- Heart shape -->
  <g transform="translate(16, 14.4) scale(0.11199999999999999)" filter="url(#shadow)">
    <path d="M0,30 C-25,10 -50,-10 -50,-30 C-50,-55 -20,-65 0,-45 C20,-65 50,-55 50,-30 C50,-10 25,10 0,30 Z" 
          fill="url(#heartGrad)"/>
  </g>
  
  <!-- Small sparkle decorations -->
  <circle cx="7.04" cy="8.96" r="0.96" fill="#ffffff" opacity="0.7"/>
  <circle cx="24.96" cy="23.04" r="0.8" fill="#ffffff" opacity="0.5"/>
</svg>