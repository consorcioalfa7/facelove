<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 180 180">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ec4899;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f0f0f0;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3.6" stdDeviation="5.3999999999999995" flood-color="#ec4899" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- Background with rounded corners -->
  <rect width="180" height="180" rx="36" ry="36" fill="#0a0a0f"/>
  
  <!-- Gradient border -->
  <rect x="2.6999999999999997" y="2.6999999999999997" width="174.6" height="174.6" rx="34.2" ry="34.2" fill="none" stroke="url(#bgGrad)" stroke-width="2.6999999999999997"/>
  
  <!-- Heart shape -->
  <g transform="translate(90, 81) scale(0.6299999999999999)" filter="url(#shadow)">
    <path d="M0,30 C-25,10 -50,-10 -50,-30 C-50,-55 -20,-65 0,-45 C20,-65 50,-55 50,-30 C50,-10 25,10 0,30 Z" 
          fill="url(#heartGrad)"/>
  </g>
  
  <!-- Small sparkle decorations -->
  <circle cx="39.6" cy="50.400000000000006" r="5.3999999999999995" fill="#ffffff" opacity="0.7"/>
  <circle cx="140.4" cy="129.6" r="4.5" fill="#ffffff" opacity="0.5"/>
</svg>