<svg xmlns="http://www.w3.org/2000/svg" width="144" height="144" viewBox="0 0 144 144">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ec4899;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f0f0f0;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2.88" stdDeviation="4.32" flood-color="#ec4899" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- Background with rounded corners -->
  <rect width="144" height="144" rx="28.8" ry="28.8" fill="#0a0a0f"/>
  
  <!-- Gradient border -->
  <rect x="2.16" y="2.16" width="139.68" height="139.68" rx="27.36" ry="27.36" fill="none" stroke="url(#bgGrad)" stroke-width="2.16"/>
  
  <!-- Heart shape -->
  <g transform="translate(72, 64.8) scale(0.504)" filter="url(#shadow)">
    <path d="M0,30 C-25,10 -50,-10 -50,-30 C-50,-55 -20,-65 0,-45 C20,-65 50,-55 50,-30 C50,-10 25,10 0,30 Z" 
          fill="url(#heartGrad)"/>
  </g>
  
  <!-- Small sparkle decorations -->
  <circle cx="31.68" cy="40.32000000000001" r="4.32" fill="#ffffff" opacity="0.7"/>
  <circle cx="112.32000000000001" cy="103.67999999999999" r="3.6" fill="#ffffff" opacity="0.5"/>
</svg>